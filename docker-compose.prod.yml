name: mattermost

services:
  mattermost:
    image: mattermost/mattermost-team-edition:12.0.1
    container_name: mattermost
    ports:
      - "8065:8065"
    environment:
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://postgres:${DB_POSTGRES_PASSWORD}@mattermost-postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      - MM_SERVICESETTINGS_SITEURL=http://localhost:8065
      - MM_TEAMSETTINGS_ENABLEOPENSERVER=false
    volumes:
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
    networks:
      - mattermost_network
    depends_on:
      db-postgres:
        condition: service_healthy
    restart: unless-stopped

  db-postgres:
    image: postgres:15-alpine
    container_name: mattermost-postgres
    environment:
      - POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD}
      - POSTGRES_DB=mattermost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mattermost"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mattermost_network
    restart: unless-stopped

networks:
  mattermost_network:
    name: mattermost_network
    driver: bridge

volumes:
  mattermost_data:
    name: mattermost_data
  mattermost_logs:
    name: mattermost_logs
  postgres_data:
    name: mattermost_postgres_data
